<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,body,#map {margin:0;width:100%;height:100%;font-family:system-ui,sans-serif}
    #message {position:absolute;z-index:1100;top:10px;left:50px;background:white;padding:6px 10px;border-radius:4px;font-size:13px}
    #message:empty {display:none}
    .point {border-radius:50%;color:white;width:28px;height:28px;text-align:center;line-height:28px;font-weight:bold}
    .road-detail td {padding:2px 5px;vertical-align:top}
  </style>
</head>
<body>
  <div id="map" role="application" aria-label="Bản đồ giao thông lịch sử Porto"></div><div id="message">Đang tải bản đồ…</div>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
</body>
</html>
